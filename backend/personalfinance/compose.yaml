services:
  postgres:
    image: postgres:16-alpine
    container_name: personalfinance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personalfinance}
      POSTGRES_USER: ${POSTGRES_USER:-personalfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - personalfinance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-personalfinance} -d ${POSTGRES_DB:-personalfinance}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  personalfinance-postgres-data:
