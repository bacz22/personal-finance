server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://chitieu.bmailflow.online}
  auth:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    password-recovery-enabled: ${PASSWORD_RECOVERY_ENABLED:false}

management:
  endpoints:
    web:
      base-path: /actuator
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
