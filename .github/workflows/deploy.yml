name: CI/CD Auto Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  filter:
    name: Detect Changed Folders
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'web-app/**'
              - '.github/workflows/deploy.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'

  deploy-frontend:
    name: Build & Deploy Frontend (Cloudflare Pages)
    needs: filter
    if: ${{ github.event_name == 'workflow_dispatch' || needs.filter.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        env:
          VITE_API_BASE_URL: https://api-chitieu.bmailflow.online
          VITE_PASSWORD_RECOVERY_ENABLED: "false"
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=bmailflow-chitieu --commit-dirty=true

  deploy-backend:
    name: Trigger Backend Deploy (Render)
    needs: filter
    if: ${{ github.event_name == 'workflow_dispatch' || needs.filter.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set!"
            exit 1
          fi
          echo "Triggering Render deploy..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
